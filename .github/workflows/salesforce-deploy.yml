name: Salesforce CI/CD

on:
  pull_request:
    branches: [dev, qa, uat, main]
  push:
    branches: [dev, qa, uat, main]

permissions:
  contents: read

concurrency:
  group: salesforce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Salesforce source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run LWC unit tests
        run: npm test

      - name: Lint source
        run: npm run lint

  deploy:
    name: Deploy to Salesforce
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Salesforce CLI
        uses: salesforcecli/setup-sf@v1

      - name: Authenticate to Salesforce
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SF_CLIENT_ID"
          test -n "$SF_USERNAME"
          test -n "$SF_JWT_KEY"
          test -n "$SF_LOGIN_URL"
          key_file="$RUNNER_TEMP/server.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SF_JWT_KEY" > "$key_file"
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$key_file" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_LOGIN_URL" \
            --alias deploy-target

      - name: Deploy source and run Apex tests
        run: >-
          sf project deploy start
          --source-dir force-app
          --target-org deploy-target
          --test-level RunLocalTests
          --wait 60
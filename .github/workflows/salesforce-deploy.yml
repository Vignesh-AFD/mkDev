name: Salesforce CI/CD

on:
  pull_request:
    branches: [dev, qa, uat, main]
  push:
    branches:
      - dev
      - qa
      - uat
      - main
      - 'feature/**'
      - 'bugfix/**'

permissions:
  contents: read

concurrency:
  group: salesforce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Salesforce source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@2
          sf --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run LWC unit tests
        run: npm test

      - name: Lint source
        run: npm run lint

  deploy:
    name: Deploy to Salesforce
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == 'dev' || github.ref_name == 'qa' ||
      github.ref_name == 'uat' || github.ref_name == 'main')
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    concurrency:
      group: salesforce-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Salesforce CLI
        uses: salesforcecli/setup-sf@v1

      - name: Authenticate to Salesforce
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run: |
          set -euo pipefail
          test -n "$SF_AUTH_URL"
          auth_file="$RUNNER_TEMP/sfdx-auth-url.txt"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$SF_AUTH_URL" > "$auth_file"
          sf org login sfdx-url \
            --sfdx-url-file "$auth_file" \
            --alias deploy-target

      - name: Deploy source and run Apex tests
        run: >-
          sf project deploy start
          --source-dir force-app
          --target-org deploy-target
          --test-level RunLocalTests
          --wait 60

  promote:
    name: Open next-stage promotion PR
    if: needs.deploy.result == 'success' && github.ref_name != 'main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD_BRANCH: ${{ github.ref_name }}
      BASE_BRANCH: ${{ github.ref_name == 'dev' && 'qa' || github.ref_name == 'qa' && 'uat' || 'main' }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}

      - name: Open or reuse promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "Promotion PR #$existing_pr is already open."
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "Promote $HEAD_BRANCH to $BASE_BRANCH" \
              --body "Automated promotion PR created after a successful Salesforce deployment to $HEAD_BRANCH. Review and merge this PR to advance the release."
          fi

  feature_qa_pr:
    name: Open feature/otcUseCase to QA PR
    if: github.event_name == 'push' && github.ref_name == 'feature/otcUseCase'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}

      - name: Open or reuse feature to QA PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: feature/otcUseCase
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list \
            --repo "$GH_REPO" \
            --state open \
            --base qa \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing_pr" ]; then
            echo "QA PR #$existing_pr is already open."
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base qa \
              --head "$HEAD_BRANCH" \
              --title "Promote feature/otcUseCase to QA" \
              --body "Automated QA PR created after CI validation passed for feature/otcUseCase. Review and merge to deploy the changes to the QA Salesforce org."
          fi
